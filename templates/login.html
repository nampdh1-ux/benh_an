<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - Windows 2000</title>
    <style>
        body {
            background-color: #008080;
            font-family: 'Tahoma', sans-serif;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }
        .window {
            background: #ece9d8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 410px;
        }
        .title-bar {
            background: linear-gradient(90deg, #0a246a 0%, #a6caf0 100%);
            padding: 4px 6px;
            color: #ffffff;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .window-body {
            padding: 16px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            background: #ffffff;
            font-size: 13px;
        }
        .btn-win {
            background: #d4d0c8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            padding: 5px 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 1px 1px 0px #000;
        }
        .btn-win:active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }
        .msg-error {
            display: none;
            background: #ffe6e6;
            color: #d8000c;
            border: 1px solid #d8000c;
            padding: 6px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 11.5px;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>🔑 Hệ Thống Xác Thực [Logon]</span>
    </div>
    <div class="window-body">
        <div id="err-box" class="msg-error"></div>

        <div id="box-step-1">
            <p style="margin-top: 0; color: #0a246a; font-weight: bold;">Nhập địa chỉ Gmail để nhận mã OTP:</p>
            <div class="form-group">
                <label for="inp-email">Gmail cá nhân:</label>
                <input type="email" id="inp-email" placeholder="tenbancuaban@gmail.com">
            </div>
            <div style="text-align: right; margin-top: 16px;">
                <button type="button" class="btn-win" id="btn-request" onclick="doRequestOtp()">Tiếp tục ❯</button>
            </div>
        </div>

        <div id="box-step-2" style="display: none;">
            <p style="margin-top: 0; color: #0a246a; font-weight: bold;">✔ Đã gửi mã OTP. Vui lòng kiểm tra email và nhập mật khẩu:</p>
            <div class="form-group">
                <label for="inp-otp">Mã OTP (6 chữ số):</label>
                <input type="text" id="inp-otp" maxlength="6" placeholder="------" style="letter-spacing: 4px; font-weight: bold; font-size: 15px;">
            </div>
            <div class="form-group">
                <label for="inp-pass">Mật khẩu hệ thống (APP_PASSWORD):</label>
                <input type="password" id="inp-pass" placeholder="••••••••">
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 16px;">
                <button type="button" class="btn-win" onclick="backStep1()">❮ Quay lại</button>
                <button type="button" class="btn-win" id="btn-verify" onclick="doVerify()">Đăng nhập</button>
            </div>
        </div>
    </div>
</div>

<script>
    let savedEmail = "";

    function showError(msg) {
        const el = document.getElementById('err-box');
        el.innerText = msg;
        el.style.display = 'block';
    }

    function clearError() {
        document.getElementById('err-box').style.display = 'none';
    }

    async function doRequestOtp() {
        clearError();
        savedEmail = document.getElementById('inp-email').value.trim();
        if (!savedEmail || !savedEmail.includes('@')) {
            showError('Vui lòng nhập địa chỉ Gmail hợp lệ!');
            return;
        }

        const btn = document.getElementById('btn-request');
        btn.disabled = true;
        btn.innerText = 'Đang gửi...';

        try {
            const res = await fetch('/api/auth/request-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: savedEmail})
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Không thể tạo OTP');

            document.getElementById('box-step-1').style.display = 'none';
            document.getElementById('box-step-2').style.display = 'block';
            document.getElementById('inp-otp').focus();
        } catch (err) {
            showError(err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Tiếp tục ❯';
        }
    }

    function backStep1() {
        clearError();
        document.getElementById('box-step-2').style.display = 'none';
        document.getElementById('box-step-1').style.display = 'block';
    }

    async function doVerify() {
        clearError();
        const otp = document.getElementById('inp-otp').value.trim();
        const pass = document.getElementById('inp-pass').value.trim();

        if (!otp) {
            showError('Vui lòng điền mã OTP!');
            return;
        }
        if (!pass) {
            showError('Vui lòng điền mật khẩu hệ thống!');
            return;
        }

        const btn = document.getElementById('btn-verify');
        btn.disabled = true;
        btn.innerText = 'Đang xác thực...';

        try {
            const res = await fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: savedEmail, otp: otp, password: pass})
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Xác thực thất bại');

            window.location.href = '/';
        } catch (err) {
            showError(err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Đăng nhập';
        }
    }
</script>
</body>
</html>
