<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - [Windows 2000 Pro]</title>
    <style>
        body {
            background-color: #ece9d8;
            font-family: 'Tahoma', sans-serif;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .window {
            background: #ece9d8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
        }
        .title-bar {
            background: linear-gradient(90deg, #0a246a 0%, #a6caf0 100%);
            padding: 6px 8px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            font-size: 13px;
        }
        .window-body {
            padding: 15px;
        }
        .form-row {
            margin-bottom: 12px;
        }
        .form-row label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            color: #000000;
        }
        .form-row input {
            width: 100%;
            padding: 5px 6px;
            box-sizing: border-box;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            background: #ffffff;
            font-size: 12px;
            font-family: 'Tahoma', sans-serif;
        }
        .btn-win2k {
            background: #d4d0c8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            padding: 4px 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Tahoma', sans-serif;
            font-size: 11.5px;
            box-shadow: 1px 1px 0px #000;
        }
        .btn-win2k:active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            box-shadow: inset 1px 1px 0px #000;
            padding: 5px 13px 3px 15px;
        }
        #alert-box {
            display: none;
            padding: 6px;
            margin-bottom: 10px;
            background: #ffcccc;
            border: 1px solid #cc0000;
            color: #cc0000;
            font-weight: bold;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>🔑 Xác thực Bệnh án lâm sàng</span>
    </div>
    <div class="window-body">
        <div id="alert-box"></div>

        <!-- BƯỚC 1: NHẬP GMAIL -->
        <div id="step-email">
            <p style="margin-top: 0; color: #0a246a; font-weight: bold;">Bước 1: Nhập Gmail của bạn để nhận mã xác thực.</p>
            <div class="form-row">
                <label>Địa chỉ Gmail:</label>
                <input type="email" id="user_email" placeholder="example@gmail.com">
            </div>
            <div style="text-align: right; margin-top: 15px;">
                <button type="button" class="btn-win2k" onclick="requestOtp()" id="btn-otp">Gửi mã OTP ❯</button>
            </div>
        </div>

        <!-- BƯỚC 2: NHẬP OTP VÀ MẬT KHẨU HỆ THỐNG -->
        <div id="step-verify" style="display: none;">
            <p style="margin-top: 0; color: #0a246a; font-weight: bold;">✔ Mã OTP đã được gửi. Vui lòng nhập mã và mật khẩu hệ thống.</p>
            <div class="form-row">
                <label>Mã OTP (6 chữ số):</label>
                <input type="text" id="otp_code" maxlength="6" placeholder="123456" style="letter-spacing: 3px; font-weight: bold;">
            </div>
            <div class="form-row">
                <label>Mật khẩu hệ thống (APP_PASSWORD):</label>
                <input type="password" id="sys_password" placeholder="••••••••">
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <button type="button" class="btn-win2k" onclick="backToEmail()">❮ Quay lại</button>
                <button type="button" class="btn-win2k" onclick="verifyAndLogin()" id="btn-login">Đăng nhập</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentEmail = "";

    function showAlert(msg) {
        const box = document.getElementById('alert-box');
        box.innerText = msg;
        box.style.display = 'block';
    }

    function hideAlert() {
        document.getElementById('alert-box').style.display = 'none';
    }

    async function requestOtp() {
        hideAlert();
        currentEmail = document.getElementById('user_email').value.trim();
        if (!currentEmail || !currentEmail.includes('@')) {
            showAlert('Vui lòng nhập đúng địa chỉ Gmail hợp lệ!');
            return;
        }

        const btn = document.getElementById('btn-otp');
        btn.disabled = true;
        btn.innerText = 'Đang gửi...';

        try {
            const res = await fetch('/api/auth/request-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: currentEmail})
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Lỗi gửi OTP');

            document.getElementById('step-email').style.display = 'none';
            document.getElementById('step-verify').style.display = 'block';
            document.getElementById('otp_code').focus();
        } catch (e) {
            showAlert(e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Gửi mã OTP ❯';
        }
    }

    function backToEmail() {
        hideAlert();
        document.getElementById('step-verify').style.display = 'none';
        document.getElementById('step-email').style.display = 'block';
    }

    async function verifyAndLogin() {
        hideAlert();
        const otp = document.getElementById('otp_code').value.trim();
        const password = document.getElementById('sys_password').value;

        if (!otp || otp.length !== 6) {
            showAlert('Vui lòng nhập đúng mã OTP gồm 6 chữ số!');
            return;
        }
        if (!password) {
            showAlert('Vui lòng nhập mật khẩu hệ thống!');
            return;
        }

        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        btn.innerText = 'Đang kiểm tra...';

        try {
            const res = await fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: currentEmail, otp: otp, password: password})
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Xác thực thất bại');

            window.location.href = '/';
        } catch (e) {
            showAlert(e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Đăng nhập';
        }
    }
</script>
</body>
</html>
