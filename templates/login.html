<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - Windows 2000</title>
    <style>
        body {
            background-color: #008080;
            font-family: 'Tahoma', sans-serif;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }
        .window {
            background: #ece9d8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
        }
        .title-bar {
            background: linear-gradient(90deg, #0a246a 0%, #a6caf0 100%);
            padding: 5px 8px;
            color: #ffffff;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .window-body {
            padding: 16px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #000000;
        }
        .form-group input {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            background: #ffffff;
            font-size: 13px;
        }
        .btn-win {
            background: #d4d0c8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            padding: 5px 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 1px 1px 0px #000;
            font-size: 12px;
        }
        .btn-win:active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 6px 15px 4px 17px;
        }
        .msg-error {
            display: none;
            background: #ffe6e6;
            color: #d8000c;
            border: 1px solid #d8000c;
            padding: 6px 8px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 11.5px;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>🔑 Xác thực Bệnh án lâm sàng</span>
    </div>
    <div class="window-body">
        <div id="err-box" class="msg-error"></div>

        <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
            <div class="form-group">
                <label for="inp-pass">Mật khẩu hệ thống (APP_PASSWORD):</label>
                <input type="password" id="inp-pass" placeholder="••••••••" autofocus autocomplete="current-password">
            </div>
            <div style="text-align: right; margin-top: 18px;">
                <button type="submit" class="btn-win" id="btn-submit">Đăng nhập ❯</button>
            </div>
        </form>
    </div>
</div>

<script>
    async function doLogin() {
        const errBox = document.getElementById('err-box');
        errBox.style.display = 'none';

        const passInput = document.getElementById('inp-pass');
        const pass = passInput.value.trim();

        if (!pass) {
            errBox.innerText = 'Vui lòng nhập mật khẩu hệ thống!';
            errBox.style.display = 'block';
            passInput.focus();
            return;
        }

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerText = 'Đang kiểm tra...';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pass})
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Mật khẩu không chính xác!');

            // Đăng nhập thành công -> chuyển về trang chủ
            window.location.href = '/';
        } catch (err) {
            errBox.innerText = err.message;
            errBox.style.display = 'block';
            passInput.select();
        } finally {
            btn.disabled = false;
            btn.innerText = 'Đăng nhập ❯';
        }
    }
</script>
</body>
</html>
